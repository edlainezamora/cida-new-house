<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Almoço de Casa Nova da Cida</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
</head>
<body>

  <!-- Header -->
  <header class="hero-section text-center text-white py-5">
    <div class="container">
      <div class="profile-photo mx-auto mb-3">
        <img src="images/cida.jpeg" alt="Cida" class="rounded-circle border border-4 border-white shadow" width="150" height="150" style="object-fit: cover;">
      </div>
      <h1 class="display-4 fw-bold font-cursive">Almoço de Casa Nova da Cida</h1>
      <p class="lead mt-2">Ajude a Cida a montar o novo lar com muito carinho!</p>
    </div>
  </header>

  <!-- Items List -->
  <main class="container py-5">
    <div id="items-list" class="row g-4">
      <!-- Items loaded from Firebase -->
    </div>

    <!-- Add New Item Button -->
    <div class="text-center mt-5">
      <button class="btn btn-add-item btn-lg" data-bs-toggle="modal" data-bs-target="#addItemModal">
        <i class="bi bi-plus-circle me-2"></i>Adicionar novo item
      </button>
    </div>
  </main>

  <!-- Add Item Modal -->
  <div class="modal fade" id="addItemModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header bg-pink text-white">
          <h5 class="modal-title">Adicionar Novo Item</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="newItemName" class="form-label">Nome do item</label>
            <input type="text" class="form-control" id="newItemName" placeholder="Ex: Jogo de panelas">
          </div>
          <div class="mb-3">
            <label for="newItemPhoto" class="form-label">Foto do item <small class="text-muted">(opcional)</small></label>
            <input type="file" class="form-control" id="newItemPhoto" accept="image/*">
          </div>
          <div id="photoPreview" class="text-center d-none mt-2">
            <img src="" alt="Preview" class="img-thumbnail" style="max-height:150px;">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-pink" id="btnAddItem">Adicionar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Confirm Gift Modal -->
  <div class="modal fade" id="confirmModal" tabindex="-1">
    <div class="modal-dialog modal-sm">
      <div class="modal-content">
        <div class="modal-header bg-pink text-white">
          <h5 class="modal-title">Confirmar presente</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p>Você tem certeza que deseja presentear com <strong id="confirmItemName"></strong>?</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-pink" id="btnConfirmGift">Confirmar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Cancel Gift Modal -->
  <div class="modal fade" id="cancelModal" tabindex="-1">
    <div class="modal-dialog modal-sm">
      <div class="modal-content">
        <div class="modal-header bg-danger text-white">
          <h5 class="modal-title">Cancelar presente</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p>Deseja mesmo cancelar este presente?</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Não</button>
          <button type="button" class="btn btn-danger" id="btnConfirmCancel">Sim</button>
        </div>
      </div>
    </div>
  </div>

  <footer class="text-center py-4 text-muted">
    <small>Feito com <i class="bi bi-heart-fill text-danger"></i> para a Cida</small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Firebase SDK (compat/namespaced) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
